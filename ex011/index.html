<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
        <p>Tente abrir esse site em vários dispositivos, ou simplismente redimensione-o</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/img3-p.png">
        <source media="(min-width: 1050px)" srcset="imagens/imagens-p.png">
        <img src="imagens/img2-p.png" alt="imagem flexível">
    </picture>

    <h1>Reproduzindo áudios</h1>
        <p>Reproduzindo áudios em HTML5</p>
            <audio src="midia/careis.mp3" controls></audio>
</body>
</html>
